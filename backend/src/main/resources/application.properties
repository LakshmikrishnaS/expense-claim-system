server.port=8080
spring.application.name=expense-claim-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expense_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Lakshmi@12}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-characters}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

app.seed.manager-name=Default Manager
app.seed.manager-email=manager@example.com
app.seed.manager-password=Manager@123

springdoc.swagger-ui.path=/swagger-ui.html
